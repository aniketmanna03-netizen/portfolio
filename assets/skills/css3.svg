<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="3D CSS3 Logo">
  <defs>
    <radialGradient id="css3dLight" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#458CF6"/>
      <stop offset="45%" stop-color="#264DE4"/>
      <stop offset="100%" stop-color="#1836B2"/>
    </radialGradient>
    <linearGradient id="cssShieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#376BEA"/>
      <stop offset="50%" stop-color="#2040C7"/>
      <stop offset="100%" stop-color="#10247C"/>
    </linearGradient>
    <linearGradient id="cssBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cssWhiteFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cssWhiteSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="css3dShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#264DE4" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#css3dShadow)">
    <!-- Base 3D Shield (Left Side) -->
    <path d="M 22 14 L 30 94 L 60 106 L 60 14 Z" fill="url(#css3dLight)"/>
    <!-- Base 3D Shield (Right Side with depth) -->
    <path d="M 60 14 L 60 106 L 90 94 L 98 14 Z" fill="url(#cssShieldRight)"/>
    
    <!-- Top Chamfer Highlight -->
    <polygon points="22,14 60,14 60,18 25,18" fill="#FFF" opacity="0.4"/>
    <polygon points="60,14 98,14 95,18 60,18" fill="#FFF" opacity="0.2"/>

    <!-- '3' Left Half -->
    <path d="M 60 32 L 36 32 L 37.5 48 L 60 48 L 60 32 Z 
             M 60 62 L 49.5 62 L 48.5 54 L 37 54 L 38 68 L 60 68 L 60 62 Z
             M 60 84.5 L 49.5 81.7 L 49 76 L 37.5 76 L 39.5 89 L 60 95 L 60 84.5 Z" 
          fill="url(#cssWhiteFront)"/>
          
    <!-- '3' Right Half -->
    <path d="M 60 32 L 84 32 L 82.5 48 L 60 48 L 60 32 Z
             M 60 62 L 72 62 L 71 74 L 60 74 L 60 62 Z
             M 83 56 L 82 70 L 60 70 L 60 56 L 83 56 Z
             M 60 84.5 L 70.5 81.7 L 71.5 70 L 83 70 L 81 89 L 60 95 L 60 84.5 Z"
          fill="url(#cssWhiteSide)"/>

    <!-- Specular Gloss Arc -->
    <path d="M 24 16 L 96 16 L 86 52 L 28 36 Z" fill="url(#cssBevel)" opacity="0.4"/>
  </g>
</svg>
