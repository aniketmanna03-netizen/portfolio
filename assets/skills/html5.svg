<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="3D HTML5 Logo">
  <defs>
    <radialGradient id="html3dLight" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF9B66"/>
      <stop offset="45%" stop-color="#F16529"/>
      <stop offset="100%" stop-color="#CC3E12"/>
    </radialGradient>
    <linearGradient id="htmlShieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F47"/>
      <stop offset="50%" stop-color="#E44D26"/>
      <stop offset="100%" stop-color="#AB2F0C"/>
    </linearGradient>
    <linearGradient id="htmlBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="htmlWhiteFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6E8EA"/>
    </linearGradient>
    <linearGradient id="htmlWhiteSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="html3dShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#E44D26" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#html3dShadow)">
    <!-- Base 3D Shield (Left Side) -->
    <path d="M 22 14 L 30 94 L 60 106 L 60 14 Z" fill="url(#html3dLight)"/>
    <!-- Base 3D Shield (Right Side with depth) -->
    <path d="M 60 14 L 60 106 L 90 94 L 98 14 Z" fill="url(#htmlShieldRight)"/>
    
    <!-- Top Chamfer Highlight -->
    <polygon points="22,14 60,14 60,18 25,18" fill="#FFF" opacity="0.4"/>
    <polygon points="60,14 98,14 95,18 60,18" fill="#FFF" opacity="0.2"/>

    <!-- '5' Left Half -->
    <path d="M 60 32 L 36 32 L 37.5 48 L 60 48 L 60 32 Z 
             M 60 62 L 49.5 62 L 48.5 54 L 37 54 L 39 74 L 60 74 L 60 62 Z
             M 60 84.5 L 49.5 81.7 L 49 76 L 37.5 76 L 39.5 89 L 60 95 L 60 84.5 Z" 
          fill="url(#htmlWhiteFront)"/>
          
    <!-- '5' Right Half -->
    <path d="M 60 32 L 84 32 L 82.5 48 L 60 48 L 60 32 Z
             M 60 62 L 72 62 L 71 74 L 60 74 L 60 62 Z
             M 60 84.5 L 70.5 81.7 L 71.5 70 L 83 70 L 81 89 L 60 95 L 60 84.5 Z"
          fill="url(#htmlWhiteSide)"/>

    <!-- Specular Gloss Arc -->
    <path d="M 24 16 L 96 16 L 86 52 L 28 36 Z" fill="url(#htmlBevel)" opacity="0.4"/>
  </g>
</svg>
